<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="project.css">
  </head>
  <body>
    <div class="container">
      <h1>Smart Task Manger</h1>
      <button id="themeBtn">Dark Mode</button>
      <form action="" id="taskForm">
        <input type="text" id="taskInput" placeholder="Enter Task" />
        <button>Add Task</button>
      </form>
      <input type="text" id="search" placeholder="Search Task..." />
      <div class="stats">
        <p>Total Tasks:<span id="total">0</span></p>
        <p>Completed: <span id="completed">0</span></p>
      </div>
      <ul id="taskList"></ul>
    </div>
    <script src="project.js"></script>
  </body>
</html>
